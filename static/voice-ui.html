<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Activity Indicator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .voice-indicator {
      position: relative;
      width: 120px;
      height: 120px;
    }
    .orb {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff 0%, #888 50%, #000 100%);
      box-shadow: 
        0 0 60px rgba(255,255,255,0.4),
        0 0 120px rgba(255,255,255,0.2),
        inset 0 0 60px rgba(255,255,255,0.1);
    }
    .orb::before {
      content: '';
      position: absolute;
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 70%);
      filter: blur(20px);
      opacity: 0;
      animation: glow 3s ease-in-out infinite;
    }
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
    }
    .ring:nth-child(2) { width: 140px; height: 140px; animation: pulse-ring 2s ease-out infinite; }
    .ring:nth-child(3) { width: 180px; height: 180px; animation: pulse-ring 2s ease-out infinite 0.4s; }
    .ring:nth-child(4) { width: 220px; height: 220px; animation: pulse-ring 2s ease-out infinite 0.8s; }
    .wave-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
    }
    .wave-bar {
      position: absolute;
      bottom: 0;
      width: 8px;
      background: linear-gradient(to top, #fff, #888);
      border-radius: 4px;
      transform-origin: bottom center;
      transform: scaleY(0.1);
    }
    .wave-bar:nth-child(1) { left: 10px; animation: wave 1.2s ease-in-out infinite; }
    .wave-bar:nth-child(2) { left: 26px; animation: wave 1.2s ease-in-out infinite 0.1s; }
    .wave-bar:nth-child(3) { left: 42px; animation: wave 1.2s ease-in-out infinite 0.2s; }
    .wave-bar:nth-child(4) { left: 58px; animation: wave 1.2s ease-in-out infinite 0.3s; }
    .wave-bar:nth-child(5) { left: 74px; animation: wave 1.2s ease-in-out infinite 0.4s; }
    .status-text {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    @keyframes pulse-ring {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.1); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .state-listening .orb { animation: breathe 4s ease-in-out infinite; }
    .state-listening .orb::before { animation: glow 4s ease-in-out infinite; }
    .state-speaking .orb { animation: speak 0.3s ease-in-out infinite; }
    .state-speaking .orb::before { animation: glow 0.3s ease-in-out infinite; }
    .state-speaking .wave-bar { animation-duration: 0.15s; }
    .state-thinking .orb { animation: think 2s ease-in-out infinite; }
    .state-thinking .orb::before { animation: glow 2s ease-in-out infinite; }
    .state-thinking .ring { animation-duration: 1.5s; }
    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
    }
    @keyframes speak {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }
    @keyframes think {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      25% { transform: translate(-50%, -50%) scale(1.05) rotate(90deg); }
      50% { transform: translate(-50%, -50%) scale(1) rotate(180deg); }
      75% { transform: translate(-50%, -50%) scale(1.05) rotate(270deg); }
    }
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
    }
    .controls button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      color: #aaa;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .controls button:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .controls button.active {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="voice-indicator" id="indicator">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="orb"></div>
    <div class="wave-container">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div class="status-text" id="status">Listening</div>
  </div>
  <div class="controls">
    <button data-state="listening" class="active">Listening</button>
    <button data-state="speaking">Speaking</button>
    <button data-state="thinking">Thinking</button>
    <button data-state="idle">Idle</button>
  </div>
  <script>
    const indicator = document.getElementById('indicator');
    const status = document.getElementById('status');
    const buttons = document.querySelectorAll('.controls button');
    
    const states = {
      listening: 'Listening',
      speaking: 'Speaking',
      thinking: 'Thinking',
      idle: 'Idle'
    };
    
    function setState(state) {
      indicator.className = 'voice-indicator';
      if (state !== 'idle') {
        indicator.classList.add(`state-${state}`);
      }
      status.textContent = states[state];
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.state === state);
      });
    }
    
    buttons.forEach(btn => {
      btn.addEventListener('click', () => setState(btn.dataset.state));
    });
    
    setState('listening');
    
    let currentState = 'listening';
    const stateKeys = Object.keys(states);
    setInterval(() => {
      currentState = stateKeys[(stateKeys.indexOf(currentState) + 1) % stateKeys.length];
      setState(currentState);
    }, 4000);
  </script>
</body>
</html>
